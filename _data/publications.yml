# Research themes shown in the RESEARCH section, in order.
# Each paper lists its theme id; papers render in the order they appear here.
themes:
  - id: signal
    title: "Explainable Physiological Signal Understanding"
    blurb: "Instruction-tuned LLMs that read raw ECG, PPG, BCG and BSG waveforms, locate diagnostic landmarks, and leave an auditable evidence trail."
  - id: clinical
    title: "Evidence-Grounded Clinical Reasoning & Evaluation"
    blurb: "Benchmarks and methods that test whether a model's diagnosis is actually supported by retrievable clinical evidence."
  - id: sensing
    title: "Ubiquitous Health & Ambient Sensing"
    blurb: "Contactless and smart-home sensing for health monitoring and human activity modeling."

